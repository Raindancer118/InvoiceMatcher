services:
  invoicematcher:
    build: .
    image: invoicematcher:latest
    ports:
      - "8080:8080"
    volumes:
      # Pruefvorgaenge und Belegbilder liegen in einer SQLite-Datei und muessen einen
      # Neustart des Containers ueberstehen.
      - invoicematcher-data:/data
    environment:
      INVOICEMATCHER_DB: "/data/invoicematcher.db"
      # Verschluesselt das Postfach-Passwort in der Einstellungen-Ablage (SecretCipher).
      INVOICEMATCHER_SETTINGS_KEY: "${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY fehlt - openssl rand -base64 32}"
      # Eigenes Unternehmen und Kontierungsrahmen kommen aus der application.yml,
      # betriebsspezifische Werte werden hier ueberschrieben.
      INVOICEMATCHER_COMPANY_NAME: "${COMPANY_NAME:-Muster zu Testzwecken GmbH}"
      INVOICEMATCHER_REVIEW_NOTIFICATION_ENABLED: "${REVIEW_MAIL_ENABLED:-false}"
      # Ohne Herausgeber laeuft die API ohne Anmeldung - im Verbund also immer setzen.
      INVOICEMATCHER_OIDC_ISSUER: "${OIDC_ISSUER:-}"
      INVOICEMATCHER_OIDC_GROUP: "${REQUIRED_GROUP:-InvoiceMatcher}"
      # Bewusst leer: die Oberflaeche spricht die API serverseitig an, nie aus dem Browser.
      # Ohne erlaubte Herkunft kann eine fremde Seite die API gar nicht erst ansprechen.
      INVOICEMATCHER_API_CORS_ALLOWED_ORIGINS: ""
      SPRING_MAIL_HOST: "${SMTP_HOST:-mx.volantic.de}"
      SPRING_MAIL_PORT: "${SMTP_PORT:-587}"
      SPRING_MAIL_USERNAME: "${SMTP_USER:-}"
      SPRING_MAIL_PASSWORD: "${SMTP_PASSWORD:-}"
      # Belegannahme aus dem Postfach. Ohne MAIL_INTAKE_ENABLED=true wird nichts abgeholt.
      INVOICEMATCHER_MAIL_ENABLED: "${MAIL_INTAKE_ENABLED:-false}"
      INVOICEMATCHER_MAIL_HOST: "${MAIL_INTAKE_HOST:-mx.volantic.de}"
      INVOICEMATCHER_MAIL_PORT: "${MAIL_INTAKE_PORT:-993}"
      INVOICEMATCHER_MAIL_USER: "${MAIL_INTAKE_USER:-belege@volantic.de}"
      INVOICEMATCHER_MAIL_PASSWORD: "${MAIL_INTAKE_PASSWORD:-}"
      # Leer heisst: jeder Absender darf Belege einliefern.
      INVOICEMATCHER_MAIL_ALLOWED_SENDERS: "${MAIL_INTAKE_ALLOWED_SENDERS:-}"
    restart: unless-stopped

  # Pruefoberflaeche. Spricht die API ueber das Compose-Netz an; der Browser sieht sie nie.
  frontend:
    build: ./frontend
    image: invoicematcher-frontend:latest
    depends_on:
      invoicematcher:
        condition: service_healthy
    ports:
      - "4321:4321"
    environment:
      INVOICEMATCHER_API: "http://invoicematcher:8080"
      OIDC_ISSUER: "${OIDC_ISSUER:?OIDC_ISSUER fehlt - siehe frontend/.env.example}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:?OIDC_CLIENT_ID fehlt}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET fehlt}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-http://localhost:4321/auth/callback}"
      OIDC_POST_LOGOUT_REDIRECT_URI: "${OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:4321/}"
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET fehlt - openssl rand -base64 32}"
      REQUIRED_GROUP: "${REQUIRED_GROUP:-InvoiceMatcher}"
    restart: unless-stopped

volumes:
  invoicematcher-data:
