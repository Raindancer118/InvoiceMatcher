spring:
  application:
    name: InvoiceMatcher

  datasource:
    # Serverlose Ablage: eine Datei, die sich sichern und weitergeben laesst.
    url: "jdbc:sqlite:${INVOICEMATCHER_DB:./data/invoicematcher.db}"
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite laesst nur einen Schreiber zu. Ein Verbindung serialisiert die Zugriffe und
      # macht SQLITE_BUSY unmoeglich - bei der Belegmenge eines Prototyps unkritisch.
      maximum-pool-size: 1

  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    de.pegasus.invoicematcher: INFO

invoicematcher:

  # Das eigene Unternehmen - daraus leitet sich die Belegrichtung ab. Nur Vorgabewert fuer den
  # allerersten Start (SettingsSeeder): danach ist die Einstellungen-Ablage massgeblich, siehe
  # CompanySettingsService.
  company:
    name: "Muster zu Testzwecken GmbH"
    vat-id: "DE 815000010"
    tax-number: "24112345678"

  # Schluessel zur Verschluesselung des Postfach-Passworts in der Einstellungen-Ablage
  # (SecretCipher). Kein Vorgabewert: ohne INVOICEMATCHER_SETTINGS_KEY soll der Start scheitern,
  # nicht mit einem Platzhalter-Schluessel weiterlaufen.
  settings:
    key: ${INVOICEMATCHER_SETTINGS_KEY}

  # Absicherung der API gegen Authentik (portal.tstieh.de).
  # Ohne issuer-uri laeuft die Anwendung OHNE Anmeldung - nur fuer lokale Entwicklung.
  security:
    issuer-uri: ${INVOICEMATCHER_OIDC_ISSUER:}
    required-group: ${INVOICEMATCHER_OIDC_GROUP:InvoiceMatcher}
    groups-claim: groups

  # Zeichenerkennung fuer gescannte Belege ohne Textebene. Setzt das Systemwerkzeug
  # 'tesseract' samt Sprachdaten voraus; fehlt es, gehen solche Belege zur Pruefung.
  ocr:
    enabled: ${INVOICEMATCHER_OCR_ENABLED:true}
    command: ${INVOICEMATCHER_OCR_COMMAND:tesseract}
    # deu+eng, nicht deu allein: mit nur deutschen Sprachdaten verliest das Modell fett
    # gesetzte Ueberschriften ("Rechnung"), und der Beleg faellt in den Belegtyp "Sonstige".
    language: ${INVOICEMATCHER_OCR_LANGUAGE:deu+eng}
    # Leer: die Sprachdaten liegen dort, wo Tesseract sie selbst sucht.
    tessdata-dir: ${INVOICEMATCHER_OCR_TESSDATA_DIR:}
    dpi: 300
    max-pages: 5
    # 3 = Tesseract erkennt die Seitenaufteilung selbst; Belege sind mehrspaltig.
    page-segmentation-mode: 3
    # Weniger Zeichen je Seite heisst: die Textebene ist leer oder eine Geraetekennung.
    min-characters-per-page: 40
    timeout: 60s

    # Ausweichweg fuer Seiten, deren Titel Tesseract nicht lesen konnte - typischerweise
    # Handschrift, die auf Druckschrift trainierte Engines regelmaessig verliest. Standardmaessig
    # AUS: das Belegbild verliesse sonst den eigenen Server an Google, was einen
    # Auftragsverarbeitungsvertrag voraussetzt. Angefragt wird ohnehin nur bei Belegen, deren
    # Titel sonst nicht erkannt wuerde, siehe FallbackOcrTextRecognizer.
    gemini:
      enabled: ${INVOICEMATCHER_OCR_GEMINI_ENABLED:false}
      api-key: ${INVOICEMATCHER_OCR_GEMINI_API_KEY:}
      model: ${INVOICEMATCHER_OCR_GEMINI_MODEL:gemini-flash-latest}
      timeout: 60s

  accounting:
    # Nettoeinzelpreis, ab dem eine Anlagenposition nicht mehr automatisch kontiert wird.
    gwg-limit: 800.00
    # Zulaessige Differenz der Rechenprobe Netto + Steuer = Brutto.
    rounding-tolerance: 0.01

    # Ausgangsrechnungen werden nur nach Steuersatz aufgeteilt.
    revenue:
      - { vat-rate: 19, account: 8400, automatic: true }
      - { vat-rate: 7,  account: 8300, automatic: true }

    # Sammelkonten, wenn der Positionstext auf keine Warengruppe passt.
    default-expense:
      - { vat-rate: 19, account: 3400, automatic: true }
      - { vat-rate: 7,  account: 3300, automatic: true }

    # Warengruppen. Bei mehreren Treffern gewinnt das laengste Stichwort.
    categories:
      - label: "Furniere/Kanten"
        account: 3401
        automatic: false
        keywords: [furnier, kante, umleimer, anleimer]
      - label: "Massiv- und Schnittholz"
        account: 3402
        automatic: false
        keywords: [kantholz, latte, brett, bohle, balken, leiste, diele, schnittholz, massivholz, rundholz]
      - label: "Plattenwerkstoffe"
        account: 3403
        automatic: false
        keywords: [platte, arbeitsplatte, tischlerplatte, pressholz, spanplatte, mdf, hdf, osb, sperrholz, leimholz]
      - label: "Lacke und Beschichtung"
        account: 3404
        automatic: false
        keywords: [lack, klarlack, lasur, farbe, farbtube, beize, grundierung, holzschutz, holzoel, hartoel, leinoel]
      - label: "Kfz-Betriebsstoffe"
        account: 4530
        automatic: false
        keywords: [diesel, benzin, e10, kraftstoff, adblue, motoroel, schmierstoff]
      - label: "Fachliteratur"
        account: 4940
        automatic: false
        keywords: [fachbuch, fachliteratur, zeitschrift, abonnement, buch]
      - label: "Buerobedarf"
        account: 4930
        automatic: false
        keywords: [buerobedarf, papier, toner, ordner, kopiergeraet, kopierer, drucker, kugelschreiber, briefumschlag]

    # Hinweise auf Anlagevermoegen. Nur zusammen mit der GWG-Grenze relevant.
    fixed-asset-keywords:
      [geraet, maschine, kopierer, drucker, computer, notebook, laptop, server, monitor,
       fahrzeug, anhaenger, stapler, werkbank, hebebuehne, kompressor, absauganlage,
       kreissaege, hobelmaschine, fraese, cnc]

  partners:
    # Sammelkonten je Anfangsbuchstabe, strikt getrennt vom Nummernkreis echter Partner.
    diverse:
      creditor-start: 70001
      debitor-start: 10001
    # Optionaler DTVF-Export; ist er gesetzt, ergaenzt er die untenstehende Liste.
    dtvf-file: ""
    known:
      - { konto: 70101, name: "Friedrich Klausmuster",        direction: EINGANG, vat-id: "DE 404131066", tax-number: "156/290/44989" }
      - { konto: 70102, name: "Sägewerk Kumpfmühle Test",     direction: EINGANG, vat-id: "DE 815000093", tax-number: "241/116/31421" }
      - { konto: 70103, name: "Jochen Redloffbeispiel",       direction: EINGANG, vat-id: "DE 433176775", tax-number: "102 161 12739" }
      - { konto: 70104, name: "Farben-Fritzebeispiel",        direction: EINGANG, vat-id: "DE 799875869", tax-number: "238/815/50725" }
      - { konto: 70105, name: "Bürobedarf Test",              direction: EINGANG, vat-id: "DE 671419214", tax-number: "202/152/66266" }
      - { konto: 70106, name: "Mustertankstelle Schmidt",     direction: EINGANG, vat-id: "DE 583708478", tax-number: "238/815/37524" }
      - { konto: 70107, name: "Sägewerk Testtanne",           direction: EINGANG, vat-id: "DE 563953914", tax-number: "156/290/96016" }
      - { konto: 70108, name: "Unkastester & Hübnerbeispiel", direction: EINGANG, vat-id: "DE 137416438", tax-number: "181/815/57016" }
      - { konto: 10101, name: "Erwin Laubangermuster",        direction: AUSGANG }
      - { konto: 10102, name: "Christiane Beispielrückers",   direction: AUSGANG }

  datev:
    # Angaben fuer das DATEV Document-Package (XML-Schnittstelle online, Version 6.0).
    generating-system: "InvoiceMatcher"
    consultant-number: ""
    client-number: ""
    client-name: ""
    incoming-folder: "Eingangsrechnungen"
    outgoing-folder: "Ausgangsrechnungen"
    xml-data-notice: "Kopie nur zur Verbuchung berechtigt nicht zum Vorsteuerabzug"

  api:
    # Herkunft des Astro-Frontends im Entwicklungsbetrieb.
    cors-allowed-origins:
      - "http://localhost:4321"
      - "http://127.0.0.1:4321"

  # Belegannahme aus einem Postfach. Ohne 'enabled: true' wird nichts verbunden und
  # nicht getaktet - eine Anwendung ohne Postfach soll keine Verbindungsfehler protokollieren.
  intake:
    mail:
      enabled: ${INVOICEMATCHER_MAIL_ENABLED:false}
      protocol: ${INVOICEMATCHER_MAIL_PROTOCOL:imaps}
      host: ${INVOICEMATCHER_MAIL_HOST:mx.volantic.de}
      port: ${INVOICEMATCHER_MAIL_PORT:993}
      username: ${INVOICEMATCHER_MAIL_USER:belege@volantic.de}
      password: ${INVOICEMATCHER_MAIL_PASSWORD:}
      folder: ${INVOICEMATCHER_MAIL_FOLDER:INBOX}
      # Bearbeitete Nachrichten werden umgelegt, nicht geloescht: die Ordner sind die
      # Spur, an der sich nachvollziehen laesst, was die Annahme getan hat.
      processed-folder: ${INVOICEMATCHER_MAIL_PROCESSED_FOLDER:Verarbeitet}
      failed-folder: ${INVOICEMATCHER_MAIL_FAILED_FOLDER:Fehlgeschlagen}
      poll-interval: ${INVOICEMATCHER_MAIL_POLL_INTERVAL:5m}
      max-messages-per-poll: 50
      max-attachment-size: 20MB
      # Wer hier steht, darf in die Buchhaltung einliefern - Vollanschrift oder Domaene
      # ("@partner.example"). Leer heisst: jeder Absender darf es.
      allowed-senders: ${INVOICEMATCHER_MAIL_ALLOWED_SENDERS:}

  review:
    # Ab diesem Konfidenzwert laeuft ein Beleg ohne menschliche Pruefung durch.
    auto-approve-threshold: 0.85
    notification:
      enabled: false
      from: "invoicematcher@volantic.de"
      to: "buchhaltung@volantic.de"
