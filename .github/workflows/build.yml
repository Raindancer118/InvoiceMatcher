name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Bauen und testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 25 einrichten
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # Die Zeichenerkennung fuer gescannte Belege ruft 'tesseract' auf. Ohne das Paket
      # ueberspringt die Testsuite die Gegenprobe mit dem echten Werkzeug - und dann wuerde
      # ein Fehler in der OCR-Stufe hier nie auffallen.
      - name: Tesseract einrichten
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-deu

      - name: Testsuite
        run: mvn -B verify

      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend bauen und pruefen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten
        run: npm ci

      - name: Typen und Astro-Diagnose
        run: npx astro check

      - name: Bauen
        run: npm run build

  image:
    name: Container-Image bauen
    needs: [test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: An der GitHub Container Registry anmelden
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry-Namen muessen kleingeschrieben sein, Repository-Namen sind es nicht zwingend.
      - name: Imagenamen bestimmen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Image bauen und veroeffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend-Image bauen und veroeffentlichen
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}-frontend:latest
            ${{ steps.image.outputs.name }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
