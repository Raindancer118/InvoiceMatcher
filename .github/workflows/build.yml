name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Bauen und testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Die eigenen Bausteine (ai-gateway, revolver) liegen in der privaten Registry
      # packages.tstieh.de. Ohne diese Zugangsdaten bricht schon das Aufloesen der
      # Abhaengigkeiten mit 401 ab. Der CI-Token darf ausschliesslich lesen.
      - name: JDK 25 einrichten
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          server-id: packages-releases
          server-username: MAVEN_REGISTRY_USERNAME
          server-password: MAVEN_REGISTRY_PASSWORD

      # Die Zeichenerkennung fuer gescannte Belege ruft 'tesseract' auf. Ohne das Paket
      # ueberspringt die Testsuite die Gegenprobe mit dem echten Werkzeug - und dann wuerde
      # ein Fehler in der OCR-Stufe hier nie auffallen.
      - name: Tesseract einrichten
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-deu

      - name: Testsuite
        run: mvn -B verify
        env:
          MAVEN_REGISTRY_USERNAME: ${{ secrets.MAVEN_REGISTRY_USERNAME }}
          MAVEN_REGISTRY_PASSWORD: ${{ secrets.MAVEN_REGISTRY_PASSWORD }}
          # Maven scheitert an packages.tstieh.de sonst im TLS-Handshake
          # ("unrecognized_name") - eine Eigenheit zwischen Mavens HTTP-Transport und der
          # Reverse-Proxy-Terminierung. Mit TLSv1.2 laeuft es zuverlaessig.
          MAVEN_OPTS: "-Djdk.tls.client.protocols=TLSv1.2"

      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend bauen und pruefen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten
        run: npm ci

      - name: Typen und Astro-Diagnose
        run: npx astro check

      - name: Bauen
        run: npm run build

  image:
    name: Container-Image bauen
    needs: [test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: An der GitHub Container Registry anmelden
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry-Namen muessen kleingeschrieben sein, Repository-Namen sind es nicht zwingend.
      - name: Imagenamen bestimmen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Der Anwendungs-Build laeuft im Image selbst und braucht dieselben Lesezugangsdaten.
      # Als BuildKit-Secret, damit sie in keiner Image-Schicht landen.
      - name: Maven-Zugangsdaten fuer den Image-Build bereitstellen
        env:
          MAVEN_REGISTRY_USERNAME: ${{ secrets.MAVEN_REGISTRY_USERNAME }}
          MAVEN_REGISTRY_PASSWORD: ${{ secrets.MAVEN_REGISTRY_PASSWORD }}
        run: |
          umask 077
          {
            echo '<settings><servers><server>'
            echo '  <id>packages-releases</id>'
            echo "  <username>${MAVEN_REGISTRY_USERNAME}</username>"
            echo "  <password>${MAVEN_REGISTRY_PASSWORD}</password>"
            echo '</server></servers></settings>'
          } > "${RUNNER_TEMP}/maven-settings.xml"

      - name: Image bauen und veroeffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          secret-files: |
            maven_settings=${{ runner.temp }}/maven-settings.xml
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend-Image bauen und veroeffentlichen
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}-frontend:latest
            ${{ steps.image.outputs.name }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
